
name: Check Terraform State Bucket

on:
  workflow_dispatch:

jobs:
  check-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Check state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="bookup-tfstate-${ACCOUNT_ID}"

          echo "Cuenta AWS: $ACCOUNT_ID"
          echo "Bucket esperado: $BUCKET"

          echo "=== Verificando existencia ==="
          aws s3api head-bucket --bucket "$BUCKET"

          echo "=== Región del bucket ==="
          aws s3api get-bucket-location --bucket "$BUCKET"

          echo "=== Objetos dentro del bucket ==="
          aws s3api list-objects-v2 --bucket "$BUCKET" --max-keys 5
